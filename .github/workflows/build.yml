name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyIPWidget-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # APK одной ссылкой: Releases → latest → MyIPWidget.apk (удобно качать с телефона)
      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MyIPWidget.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MyIPWidget.apk \
            --title "My IP Widget (сборка ${{ github.run_number }})" \
            --notes "Коммит ${{ github.sha }}"
